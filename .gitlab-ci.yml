image: node:24

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

lint:
  stage: check
  script:
    - npm run lint

typecheck:
  stage: check
  script:
    - npm run typecheck

test:
  stage: check
  # Base jetable pour les tests d'intégration de l'API (migrations appliquées par Vitest)
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_DB: flowops_test
    POSTGRES_USER: flowops
    POSTGRES_PASSWORD: flowops
    TEST_DATABASE_URL: postgresql://flowops:flowops@postgres:5432/flowops_test
  script:
    - npm run test

format:
  stage: check
  script:
    - npm run format:check
