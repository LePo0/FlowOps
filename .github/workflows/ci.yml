name: CI

on:
  pull_request:
  push:
    branches: [main]

# Annule le pipeline précédent d'une même branche quand un nouveau commit arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # Base jetable pour les tests d'intégration de l'API (migrations appliquées par Vitest)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: flowops_test
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://flowops:flowops@localhost:5432/flowops_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  # Parcours complets dans un navigateur : éditeur, API, base et émulateur Firebase Auth
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: flowops_e2e
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://flowops:flowops@localhost:5432/flowops_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # L'émulateur Firebase est une application Java (21 ou plus)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Archive de l'émulateur, téléchargée au premier lancement
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e -w e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # Image de l'API (Dockerfile) : construite, puis lancée contre une base jetable
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: flowops
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t flowops-api .
      - name: Taille de l'image
        run: docker image ls flowops-api --format "{{.Size}}"
      - name: Démarrage de l'image
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql://flowops:flowops@localhost:5432/flowops \
            -e FIREBASE_PROJECT_ID=flowops-ci \
            flowops-api
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health
          # Sans jeton : 401, comme en local
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/workflows)" = 401
          # Le processus ne tourne pas en root
          test "$(docker exec api id -u)" != 0
      - if: always()
        run: docker logs api
