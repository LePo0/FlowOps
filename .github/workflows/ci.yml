name: CI

on:
  pull_request:
  push:
    branches: [main]

# Annule le pipeline précédent d'une même branche quand un nouveau commit arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # Base jetable pour les tests d'intégration de l'API (migrations appliquées par Vitest)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: flowops_test
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://flowops:flowops@localhost:5432/flowops_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
